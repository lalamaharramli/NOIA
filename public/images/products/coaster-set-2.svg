<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
  
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#F6EEE1" />
        <stop offset="100%" stop-color="#E8D5BD" />
      </linearGradient>
      <radialGradient id="glow" cx="35%" cy="22%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
        <stop offset="55%" stop-color="#6B4B33" stop-opacity="0" />
        <stop offset="100%" stop-color="#6B4B33" stop-opacity="0.12" />
      </radialGradient>
      <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#5A4231" flood-opacity="0.18" />
      </filter>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.055" />
        </feComponentTransfer>
      </filter>
    </defs>
  <rect width="1000" height="1250" fill="url(#bg)" />
  <rect width="1000" height="1250" fill="url(#glow)" />
  <circle cx="500" cy="610" r="395" fill="#EFE2CD" opacity="0.35" />
  <circle cx="500" cy="610" r="395" fill="none" stroke="#A9714B" stroke-width="1.5" opacity="0.18" stroke-dasharray="11 9" stroke-linecap="round" />
  <g transform="translate(500 610) translate(-20 -40) scale(1.55)" filter="url(#softShadow)">
    <g>
      <g transform="translate(-108 -94) rotate(-6)">
        <circle r="112" fill="#EFE2CD" stroke="#A9714B" stroke-width="9" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="80" fill="none" stroke="#CBA97F" stroke-width="8" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="48" fill="none" stroke="#A9714B" stroke-width="7" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="18" fill="#8C927A" opacity="0.9" />
      </g>
      <g transform="translate(108 -94) rotate(-2)">
        <circle r="112" fill="#EFE2CD" stroke="#A9714B" stroke-width="9" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="80" fill="none" stroke="#8C927A" stroke-width="8" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="48" fill="none" stroke="#A9714B" stroke-width="7" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="18" fill="#8C927A" opacity="0.9" />
      </g>
      <g transform="translate(-108 104) rotate(2)">
        <circle r="112" fill="#EFE2CD" stroke="#A9714B" stroke-width="9" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="80" fill="none" stroke="#CBA97F" stroke-width="8" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="48" fill="none" stroke="#A9714B" stroke-width="7" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="18" fill="#8C927A" opacity="0.9" />
      </g>
      <g transform="translate(108 104) rotate(6)">
        <circle r="112" fill="#EFE2CD" stroke="#A9714B" stroke-width="9" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="80" fill="none" stroke="#8C927A" stroke-width="8" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="48" fill="none" stroke="#A9714B" stroke-width="7" stroke-dasharray="11 9" stroke-linecap="round" />
        <circle r="18" fill="#8C927A" opacity="0.9" />
      </g></g>
  </g>
  <rect width="1000" height="1250" fill="url(#vignette)" />
  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.65" style="mix-blend-mode:multiply" />
